name: Build frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-assistant-frontend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy Vue frontend on MacBook M2
    runs-on: [self-hosted, macOS, ARM64]
    env:
      WEB_HOST: 192.168.31.6
      WEB_PORT: 10080
      WEB_USER: web
      WEB_ROOT: /srv/www/personal-assistant
      WEB_SSH_KEY: /Users/lyu/.ssh/personal_assistant_web
      SERVER_PORT: 18000
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://${{ env.WEB_HOST }}:${{ env.SERVER_PORT }}/api

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-assistant-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

      - name: Deploy frontend to web server
        shell: bash
        run: |
          set -euo pipefail

          release_id="${GITHUB_SHA:0:12}"
          remote_release="${WEB_ROOT}/releases/${release_id}"
          ssh_options="-i ${WEB_SSH_KEY} -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes"

          ssh ${ssh_options} "${WEB_USER}@${WEB_HOST}" \
            "mkdir -p '${remote_release}'"

          rsync -az --delete \
            -e "ssh ${ssh_options}" \
            dist/ \
            "${WEB_USER}@${WEB_HOST}:${remote_release}/"

          ssh ${ssh_options} "${WEB_USER}@${WEB_HOST}" \
            "test -f '${remote_release}/index.html' && ln -sfnT '${remote_release}' '${WEB_ROOT}/current'"

          echo "Deployed ${GITHUB_SHA} to ${WEB_USER}@${WEB_HOST}:${remote_release}"
          echo "Web: http://${WEB_HOST}:${WEB_PORT}; API: http://${WEB_HOST}:${SERVER_PORT}/api"
